<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Constructora Especializada · Prototipo demo — Plataforma de Administración de Inmuebles, Portales y Contabilidad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   GRAFITO Design System v1.5 — Prototipo demo
   Tokens equivalentes a docs/ui/tokens.css (fuente de verdad)
   ============================================================ */
:root{
  --n0:#FFFFFF; --n50:#F8F9FB; --n100:#F1F3F6; --n200:#E3E6EB; --n300:#CFD4DC;
  --n400:#A6AEBB; --n500:#7C8694; --n600:#5B6470; --n700:#3E4653; --n800:#2A313D;
  --n900:#1B212B; --n950:#10151D;
  --brand:#1B212B; --brand-h:#2A313D; --brand-a:#10151D;
  --bg-canvas:#F6F7F9; --bg-content:#FFFFFF; --bg-subtle:#F1F3F6; --bg-muted:#E9EDF1; --bg-hover:#EDF0F4; --bg-disabled:#F1F3F6;
  --text-p:#1B212B; --text-s:#5B6470; --text-t:#697486; --text-d:#9AA3AD; --text-inv:#FFFFFF; --text-link:#1D4ED8;
  --border-subtle:#E3E6EB; --border-default:#CFD4DC; --border-strong:#A6AEBB;
  --scaffold-bg:#141A22; --scaffold-bg-h:#1F2733; --scaffold-bg-act:#2A3441; --scaffold-border:#2B3442;
  --scaffold-text:#E6E9EE; --scaffold-text-m:#9AA3B0;
  --succ:#146C43; --succ-bg:#E7F2EC; --succ-bd:#9ECFB3;
  --warn:#7A4F00; --warn-bg:#FCF3D9; --warn-bd:#E3C768;
  --danger:#B42318; --danger-bg:#FCE8E6; --danger-bd:#F0A8A0;
  --info:#1D4ED8; --info-bg:#E8F0FE; --info-bd:#A9C8F5;
  --neutral:#5B6470; --neutral-bg:#F1F3F6; --neutral-bd:#CFD4DC;
  --scrim:rgba(16,21,29,.45);
  --focus-ring:rgba(27,33,43,.16);
  --shadow-sm:0 1px 2px rgba(16,21,29,.06);
  --shadow-md:0 2px 4px rgba(16,21,29,.08),0 1px 0 rgba(16,21,29,.02);
  --shadow-lg:0 8px 24px rgba(16,21,29,.12),0 2px 8px rgba(16,21,29,.08);
  --shadow-xl:0 16px 48px rgba(16,21,29,.24),0 4px 16px rgba(16,21,29,.08);
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-pill:999px;
  --font-ui:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','JetBrains Mono',Consolas,monospace;
  --sp-1:2px; --sp-2:4px; --sp-3:8px; --sp-4:12px; --sp-5:16px; --sp-6:20px; --sp-7:24px; --sp-8:32px; --sp-9:40px; --sp-10:48px;
  --sidebar-w:256px; --topbar-h:56px; --row-h:44px; --row-h-dense:36px;
  --dur-1:100ms; --dur-2:150ms; --dur-3:200ms;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:80px}
body{font-family:var(--font-ui);font-size:14px;line-height:1.5;color:var(--text-p);background:var(--n50);font-feature-settings:'ss01','cv11';overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
a{color:var(--text-link);text-decoration:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text-p)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
::placeholder{color:var(--text-t)}
.mono{font-family:var(--font-mono);font-feature-settings:"tnum"}
.money,td.num,.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--text-s)} .muted2{color:var(--text-t)} .small{font-size:12px}
.strong{font-weight:600} .right{text-align:right} .center{text-align:center}
.nowrap{white-space:nowrap}
.flex{display:flex;align-items:center;gap:var(--sp-3)} .between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid{display:grid;gap:var(--sp-5)} .g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
.mt-1{margin-top:var(--sp-3)} .mt-2{margin-top:var(--sp-5)} .mt-3{margin-top:var(--sp-7)} .mt-4{margin-top:var(--sp-8)}
.mb-1{margin-bottom:var(--sp-3)} .mb-2{margin-bottom:var(--sp-5)}
[hidden]{display:none !important}
svg{flex:none}
@media (prefers-reduced-motion:reduce){ *,*::after,*::before{animation-duration:.01ms !important;transition-duration:.01ms !important;scroll-behavior:auto !important} }

/* ---------- Botones ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--sp-3);height:36px;padding:0 16px;border-radius:var(--radius-md);
  border:1px solid transparent;font-size:14px;font-weight:500;transition:background var(--dur-1),border-color var(--dur-1),color var(--dur-1);white-space:nowrap;line-height:1}
.btn svg{width:16px;height:16px}
.btn:disabled{background:var(--bg-disabled);color:var(--text-d);cursor:not-allowed;border-color:transparent}
.btn-sm{height:28px;padding:0 12px;font-size:13px}
.btn-lg{height:44px;padding:0 20px;font-size:15px}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--brand-h)}
.btn-primary:active:not(:disabled){background:var(--brand-a)}
.btn-secondary{background:var(--bg-content);border-color:var(--border-default);color:var(--text-p)}
.btn-secondary:hover:not(:disabled){background:var(--bg-hover)}
.btn-ghost{background:transparent;color:var(--text-s)}
.btn-ghost:hover:not(:disabled){background:var(--bg-subtle);color:var(--text-p)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:#99231A}
.btn-link{background:none;border:none;color:var(--text-link);font-size:14px;padding:4px 6px;font-weight:500}
.btn-icon{width:36px;padding:0;flex:none;border:1px solid transparent;background:transparent;color:var(--text-s);border-radius:var(--radius-md);display:inline-flex;align-items:center;justify-content:center;transition:background var(--dur-1),color var(--dur-1)}
.btn-icon svg{width:20px;height:20px}
.btn-icon:hover:not(:disabled){background:var(--bg-subtle);color:var(--text-p)}
.btn-icon:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.btn-icon-row{width:44px;height:44px}
.btn-block{width:100%}
.upload-zone{display:flex;align-items:center;gap:var(--sp-3);border:1.5px dashed var(--border-default);border-radius:var(--radius-lg);padding:var(--sp-4) var(--sp-5);cursor:pointer;color:var(--text-s);background:var(--bg-subtle);transition:border-color var(--dur-1),background var(--dur-1)}
.upload-zone:hover{border-color:var(--brand);background:var(--bg-hover)}
.upload-zone svg{width:20px;height:20px;flex:none}
.upload-zone-sm{padding:var(--sp-3) var(--sp-4);font-size:13px;border-radius:var(--radius-md)}
.upload-zone-sm svg{width:16px;height:16px}

/* ---------- Chips / badges ---------- */
.chip{display:inline-flex;align-items:center;gap:var(--sp-2);height:22px;padding:0 var(--sp-3);border-radius:var(--radius-pill);font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip-success{color:var(--succ);background:var(--succ-bg);border-color:var(--succ-bd)}
.chip-warning{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.chip-danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-bd)}
.chip-info{color:var(--info);background:var(--info-bg);border-color:var(--info-bd)}
.chip-neutral{color:var(--neutral);background:var(--neutral-bg);border-color:var(--neutral-bd)}
.badge{display:inline-flex;align-items:center;justify-content:center;height:18px;min-width:18px;padding:0 6px;border-radius:var(--radius-pill);background:var(--brand);color:#fff;font-size:11px;font-weight:600}
.chip-remove{background:none;border:none;color:inherit;cursor:pointer;display:inline-flex;padding:0;margin-left:2px}
.chip-remove svg{width:12px;height:12px}

/* ---------- Tarjetas ---------- */
.card{background:var(--bg-content);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--sp-5);transition:box-shadow var(--dur-2)}
.card-hover:hover{box-shadow:var(--shadow-md)}
.rh-mod-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp-7);margin-top:var(--sp-6)}
.rh-mod-grid .stat-ico{width:38px;height:38px;flex:none}
.rh-mod-card{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-5);text-align:left;cursor:pointer}
.rh-mod-card .rh-mod-info{flex:1;min-width:0}
.rh-mod-card .rh-mod-info .strong{display:block;font-size:14px;line-height:1.3}
.rh-mod-card .rh-mod-info .small{display:block;line-height:1.45;margin-top:var(--sp-1)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-4)}
/* Separación vertical uniforme entre secciones apiladas (§6.7). Los grids no la usan (gap propio). */
.content > .card + .card,
.content > .card + .g2,
.content > .card + .g3,
.content > .g2 + .card,
.content > .g2 + .g2,
.content > .g2 + .g3,
.content > .g3 + .card,
.content > .g3 + .g2,
.content > .g3 + .g3{margin-top:var(--sp-5)}
.grid > .card + .card,
.g2 > .card + .card,
.g3 > .card + .card,
.kpis > .card + .card,
.kpis-4 > .card + .card,
.mini-grid > .card + .card,
.mini-grid-sm > .card + .card,
.grid-dash > .card + .card,
.form-grid > .card + .card,
.rh-mod-grid > .card + .card{margin-top:0}
/* Tabla dentro de card: se integra sin borde propio (la card provee el contenedor, §6.5). Las tbl-wrap standalone conservan borde. */
.card .tbl-wrap:not([style]){border:none;box-shadow:none;border-radius:0}
.card-title{font-size:16px;font-weight:600}
.card-sub{font-size:13px;color:var(--text-s)}
.stat-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-s)}
.stat-value{font-size:30px;font-weight:600;line-height:1.2;margin-top:var(--sp-3);font-variant-numeric:tabular-nums}
.stat-delta{font-size:13px;font-weight:500;margin-top:var(--sp-3);display:flex;align-items:center;gap:4px}
.stat-meta{font-size:13px;color:var(--text-s);margin-top:var(--sp-2)}
.up{color:var(--succ)} .down{color:var(--danger)} .flat{color:var(--text-s)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--sp-5);align-items:stretch;margin-bottom:var(--sp-6)}
.kpis .card{min-width:0}
.kpis .stat-value{font-size:clamp(19px,1.9vw,28px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis .stat-meta{font-size:12px;line-height:1.45}
/* ---------- Dashboard ejecutivo ---------- */
.stat-card-h{display:flex;gap:var(--sp-4);align-items:flex-start}
.stat-body{flex:1;min-width:0}
.stat-ico{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--bg-subtle);color:var(--text-s)}
.stat-ico.succ{background:color-mix(in srgb,var(--succ) 14%,transparent);color:var(--succ)}
.stat-ico.danger{background:color-mix(in srgb,var(--danger) 13%,transparent);color:var(--danger)}
.stat-ico.brand{background:color-mix(in srgb,var(--brand) 13%,transparent);color:var(--brand)}
.stat-card-h .stat-value{margin-top:var(--sp-1)}
.stat-card-h .stat-delta{margin-top:var(--sp-2)}
.stat-card-h .stat-meta{margin-top:var(--sp-1)}
select.chip-select{appearance:auto;height:42px;padding:0 12px;cursor:pointer;font-family:inherit}
/* ---------- Mosaico de KPIs alineado (columnas iguales, sin salto) ---------- */
.kpis-4{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--sp-5);margin-bottom:var(--sp-6);align-items:stretch}
.kpis-4 .card{min-width:0;display:flex}
.kpis-4 .stat-card-h{flex:1;align-items:stretch;gap:var(--sp-4)}
.kpis-4 .stat-body{flex:1;min-width:0;display:flex;flex-direction:column}
.kpis-4 .stat-body .stat-meta{margin-top:auto}
.kpis-4 .stat-value{font-size:clamp(19px,1.9vw,28px);line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpis-4 .stat-ico{width:38px;height:38px;border-radius:10px}
.kpis-4 .stat-meta{font-size:12px;line-height:1.45}
@media (max-width:1499px){.kpis-4 .stat-ico{display:none}.kpis-4 .stat-card-h{gap:0}}
@media (max-width:599px){.kpis-4{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:var(--sp-5)}.kpis-4 .stat-value{font-size:20px;white-space:normal;overflow:visible}}
.dash-toolbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-6)}
.dash-toolbar .spacer{flex:1}
.chip-select{display:inline-flex;align-items:center;gap:8px;background:var(--bg-content);border:1px solid var(--border-subtle);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;color:var(--text-p);box-shadow:var(--shadow-sm);cursor:pointer;transition:border-color var(--dur-2),color var(--dur-2)}
.chip-select:hover{border-color:var(--brand);color:var(--brand)}
.grid-dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-5);margin-bottom:var(--sp-6);align-items:start}
.mini-list{display:flex;flex-direction:column}
.mini-row{display:flex;align-items:flex-start;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border-subtle)}
.mini-row:last-child{border-bottom:none}
.mini-ico{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--bg-subtle);color:var(--text-s);flex:none;margin-top:var(--sp-1)}
.mini-main{flex:1;min-width:0}
.mini-title{font-size:14px;font-weight:600;line-height:1.4}
.mini-sub{font-size:12px;color:var(--text-s);margin-top:var(--sp-1);display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--sp-5);align-items:stretch}
.mini-grid-sm{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:var(--sp-4);align-items:stretch}
/* ---------- Componentes auxiliares (compuestos de tarjeta / tabla / lista) ---------- */
.stat-card{display:flex;flex-direction:column;min-width:0}
.card-body{padding-top:var(--sp-2)}
.input-like{display:flex;align-items:center;min-height:36px;padding:0 12px;background:var(--bg-subtle);border:1px solid var(--border-subtle);border-radius:var(--radius-md);font-size:14px;color:var(--text-p)}
.sol-row{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) 0;border-bottom:1px solid var(--border-subtle)}
.emp-id{display:flex;align-items:center;gap:var(--sp-3)}
.s-ico{width:36px;height:36px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--bg-subtle);color:var(--text-s);flex:none}
.stat-ico.warn{background:color-mix(in srgb,var(--warn) 13%,transparent);color:var(--warn)}

/* ---------- Tablas ---------- */
.tbl-wrap{overflow-x:auto;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl thead th{background:var(--bg-subtle);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-s);
  border-bottom:1px solid var(--border-subtle);padding:10px 14px;text-align:left;white-space:nowrap}
.tbl thead th.num{text-align:right}
.tbl tbody td{padding:12px 14px;border-bottom:1px solid var(--border-subtle);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl-hover tbody tr:hover{background:var(--bg-hover)}
.tbl tbody td.num{text-align:right;font-variant-numeric:tabular-nums}
.tbl.dense tbody td{padding:7px 12px}
.tbl.dense thead th{padding:8px 12px}
.tbl caption{caption-side:top;text-align:left;font-size:13px;color:var(--text-s);padding:10px 14px}
.rowlink{cursor:pointer}
.rowlink:hover{background:var(--bg-hover)}
.detail-row{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-5);padding:4px 0}
.detail-md{padding:6px 0}
.detail-lg{padding:10px 0}
.detail-bd{border-bottom:1px solid var(--border-subtle);padding:6px 0}
.detail-dash{border-bottom:1px dashed var(--border-subtle);padding:6px 0}
.detail-top{border-top:1px solid var(--border-subtle);padding:6px 0}
.detail-xl{padding:12px 0}
.detail-tool{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-4);flex-wrap:wrap;padding:14px 4px 2px}
.detail-tot{display:flex;justify-content:space-between;gap:var(--sp-4);padding:10px 2px 0}
.card.tbl-card{padding:0;overflow:hidden}
.tbl-card .card-head{padding:16px 16px 0;margin-bottom:0}
.tbl-card .tbl-wrap{border:none;box-shadow:none;border-radius:0}
.col-act{width:44px}
.w110{width:110px}.w120{width:120px}.w150{width:150px}.w220{width:220px}
.v-danger{color:var(--danger)}.v-warn{color:var(--warn)}.v-succ{color:var(--succ)}.v-info{color:var(--info)}.v-brand{color:var(--brand)}
.photo-ph{aspect-ratio:1;border-radius:var(--radius-lg);background:var(--bg-subtle);display:flex;align-items:center;justify-content:center;color:var(--text-t)}
.inm-ph{width:88px;height:88px;border-radius:var(--radius-lg);background:var(--bg-subtle);display:flex;align-items:center;justify-content:center;font-size:36px;flex:none;color:var(--text-t)}
.overlay.side{justify-content:flex-end;padding:0}
.st-sect{display:block;margin-bottom:var(--sp-4)}
.total-val{font-size:16px}
.stat-value.sm{font-size:18px}.stat-value.md{font-size:22px}.stat-value.lg{font-size:24px}

/* ---------- Formularios ---------- */
.field{margin-bottom:var(--sp-4)}
.field label{display:block;font-size:12px;font-weight:500;color:var(--text-p);margin-bottom:var(--sp-3)}
.field .req{color:var(--danger)}
.field .help{font-size:12px;color:var(--text-s);margin-top:var(--sp-2)}
.field .err{font-size:12px;color:var(--danger);margin-top:var(--sp-2);display:flex;align-items:center;gap:var(--sp-2);font-weight:500}
.input,select.input,textarea.input{width:100%;height:36px;border:1px solid var(--border-default);border-radius:var(--radius-md);padding:0 12px;background:#fff;font-size:14px}
textarea.input{height:auto;padding:10px 12px;resize:vertical}
select.input{appearance:auto}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus-ring);outline:none}
.input[aria-invalid="true"]{border-color:var(--danger);box-shadow:0 0 0 3px rgba(180,35,24,.12)}
.input:disabled{background:var(--bg-disabled);color:var(--text-d)}
.input.ro{background:var(--bg-subtle);color:var(--text-t);cursor:default;border-color:var(--border-subtle)}
.money-input{position:relative}
.money-input .pref{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-s);font-size:14px;pointer-events:none}
.money-input .input{padding-left:40px}
.check{display:inline-flex;align-items:center;gap:var(--sp-3);font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--brand)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-5)}
.form-actions{display:flex;justify-content:flex-end;gap:var(--sp-3);margin-top:var(--sp-6)}
.err-summary{background:var(--danger-bg);border:1px solid var(--danger-bd);color:var(--danger);border-radius:var(--radius-lg);padding:var(--sp-4) var(--sp-5);font-size:13px;margin-bottom:var(--sp-5)}
.err-summary a{color:var(--danger);font-weight:600}

/* ---------- Selección de permisos (roles) ---------- */
.perm-toolbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-4)}
.perm-toolbar .search{position:relative;flex:1 1 240px;min-width:180px}
.perm-toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-s);pointer-events:none}
.perm-toolbar .search input{width:100%;height:36px;padding:0 12px 0 36px;border:1px solid var(--border-default);border-radius:var(--radius-md);font-size:13px}
.perm-toolbar .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus-ring);outline:none}
.perm-count{font-size:13px;font-weight:600;color:var(--text-s);white-space:nowrap}
.perm-mod{border:1px solid var(--border-subtle);border-radius:var(--radius-lg);background:var(--bg-content);overflow:hidden;margin-bottom:var(--sp-3)}
.perm-mod-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:8px 14px;cursor:pointer;user-select:none}
.perm-mod-head:hover{background:var(--bg-hover)}
.perm-mod-title{display:flex;align-items:center;gap:var(--sp-3);min-width:0;flex-wrap:wrap}
.perm-mod-body{border-top:1px solid var(--border-subtle)}
.perm-row{display:flex;align-items:center;gap:var(--sp-3);padding:7px 14px;border-bottom:1px solid var(--border-subtle);cursor:pointer;min-width:0}
.perm-row:last-child{border-bottom:none}
.perm-row:hover{background:var(--bg-hover)}
.perm-row input{width:16px;height:16px;accent-color:var(--brand);flex:none}
.perm-label{font-size:13px;color:var(--text-p);min-width:0;word-wrap:break-word}
.perm-code{margin-left:auto;font-size:11px;color:var(--text-t);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px;flex:none}
.perm-chev{color:var(--text-t);display:inline-flex;transition:transform .15s ease;flex:none}
.perm-mod.expanded .perm-chev{transform:rotate(180deg)}
.perm-empty{padding:14px;font-size:13px;color:var(--text-s)}
.perm-foot-note{font-size:12px;font-weight:600;color:var(--text-t)}

/* ---------- Toolbar / filtros ---------- */
.toolbar{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.toolbar .search{position:relative;flex:1 1 260px;min-width:200px}
.toolbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-s);pointer-events:none}
.toolbar .search input{width:100%;height:36px;padding:0 12px 0 36px;border:1px solid var(--border-default);border-radius:var(--radius-md);font-size:14px}
.toolbar .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus-ring);outline:none}
.chips-row{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap;margin-bottom:var(--sp-5)}
.pagination{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4) var(--sp-5);font-size:13px;color:var(--text-s)}
.pagination .pages{display:flex;align-items:center;gap:var(--sp-2)}
.page-btn{min-width:28px;height:28px;padding:0 var(--sp-2);border:1px solid var(--border-default);background:#fff;border-radius:var(--radius-sm);font-size:13px;display:inline-flex;align-items:center;justify-content:center;color:var(--text-p)}
.page-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
.page-btn:disabled{color:var(--text-d);cursor:not-allowed}
.page-dots{min-width:24px;text-align:center;color:var(--text-d);font-size:13px}
.page-size{width:70px;height:28px;font-size:13px;padding:0 6px}

/* ---------- App shell ---------- */
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--scaffold-bg);color:var(--scaffold-text);flex:none;display:flex;flex-direction:column;position:fixed;inset:0 auto 0 0;z-index:var(--z-drawer,300);transition:transform var(--dur-3)}
.brand{display:flex;align-items:center;gap:12px;height:var(--topbar-h);padding:0 20px;border-bottom:1px solid var(--scaffold-border);flex:none}
.brand-logo{width:32px;height:32px;border-radius:var(--radius-md);background:var(--scaffold-text);color:var(--scaffold-bg);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
.brand-name{font-weight:600;font-size:13px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:172px}
.brand-sub{font-size:11px;color:var(--scaffold-text-m)}
.side-nav{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 10px 24px;scrollbar-width:thin;scrollbar-color:transparent transparent;transition:scrollbar-color var(--dur-2)}
  .side-nav:hover,.side-nav:focus-within{scrollbar-color:rgba(154,163,176,.45) transparent}
  .side-nav::-webkit-scrollbar{width:6px;height:6px}
  .side-nav::-webkit-scrollbar-track{background:transparent}
  .side-nav::-webkit-scrollbar-thumb{background:transparent;border-radius:999px}
  .side-nav:hover::-webkit-scrollbar-thumb,.side-nav:focus-within::-webkit-scrollbar-thumb{background:rgba(154,163,176,.45);border:1px solid rgba(230,233,238,.12)}
  .side-nav::-webkit-scrollbar-thumb:hover{background:rgba(230,233,238,.7)}
.nav-group{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--scaffold-text-m);padding:var(--sp-5) var(--sp-3) var(--sp-3)}
.nav-group-btn{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);width:100%;background:none;border:0;padding:var(--sp-5) var(--sp-3) var(--sp-3);color:var(--scaffold-text-m);font-family:inherit;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;text-align:left;cursor:pointer;border-radius:var(--radius-md);min-height:34px}
.nav-group-btn:hover{color:var(--scaffold-text);background:var(--scaffold-bg-h)}
.nav-group-btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:-1px}
.nav-group-btn .chev{display:inline-flex;flex:none;color:var(--scaffold-text-m);transition:transform var(--dur-2)}
.nav-group-btn[aria-expanded="true"] .chev{transform:rotate(180deg)}
.nav-group-btn:hover .chev{color:var(--scaffold-text)}
.nav-collapse{display:none}
.nav-collapse.open{display:block}
.nav-collapse .nav-a{padding-left:26px}
.nav-a{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:var(--radius-md);color:var(--scaffold-text);font-size:14px;font-weight:500;text-decoration:none;position:relative;margin-bottom:2px;transition:background var(--dur-1)}
.nav-a:hover{background:var(--scaffold-bg-h)}
.nav-a.active{background:var(--scaffold-bg-act);color:#fff}
.nav-a.active::before{content:"";position:absolute;left:-10px;top:0;bottom:0;width:3px;background:#fff;border-radius:0 3px 3px 0}
.nav-a svg{width:18px;height:18px}
.nav-sub{font-size:13px;color:var(--scaffold-text-m);padding-left:38px}
.nav-a .pill{margin-left:auto}
.main{flex:1;min-width:0;margin-left:var(--sidebar-w);display:flex;flex-direction:column}
.topbar{height:var(--topbar-h);background:var(--bg-content);border-bottom:1px solid var(--border-subtle);display:flex;align-items:center;gap:var(--sp-4);padding:0 24px;position:sticky;top:0;z-index:var(--z-header,200)}
.topbar .search{position:relative;flex:1 1 300px;max-width:440px}
.topbar .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--text-s);pointer-events:none}
.topbar .search input{width:100%;height:36px;padding:0 12px 0 36px;border:1px solid var(--border-default);border-radius:var(--radius-md);font-size:14px}
.topbar .search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus-ring);outline:none}
.icon-btn{width:36px;height:36px;border:1px solid transparent;background:none;border-radius:var(--radius-md);color:var(--text-s);display:inline-flex;align-items:center;justify-content:center;position:relative}
.icon-btn:hover{background:var(--bg-subtle);color:var(--text-p)}
.icon-btn svg{width:20px;height:20px}
.icon-btn .dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff}
.user-chip{display:flex;align-items:center;gap:10px;padding:4px 8px;border-radius:var(--radius-lg);cursor:pointer;border:1px solid transparent}
.user-chip:hover{background:var(--bg-subtle)}
.user-chip .avatar{width:32px;height:32px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
.user-chip .u-n{font-size:13px;font-weight:600;line-height:1.2;text-align:left}
.user-chip .u-r{font-size:11px;color:var(--text-s)}
.content{padding:var(--sp-7);flex:1;width:100%;max-width:1500px;margin:0 auto}
.breadcrumb{font-size:13px;color:var(--text-s);margin-bottom:4px}
.breadcrumb a{color:var(--text-s)}
.breadcrumb a:hover{color:var(--text-link)}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);margin-bottom:var(--sp-6);flex-wrap:wrap}
.page-title{font-size:24px;font-weight:600;line-height:1.3}
.page-desc{font-size:13px;color:var(--text-s);margin-top:var(--sp-1)}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:var(--sp-3);border-bottom:1px solid var(--border-subtle);margin-bottom:var(--sp-6);overflow-x:auto}
.tab{padding:var(--sp-3) var(--sp-2);border:none;background:none;font-size:14px;font-weight:500;color:var(--text-s);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--text-p)}
.tab.active{color:var(--text-p);font-weight:600;border-bottom-color:var(--brand)}

/* ---------- Timeline / línea de tiempo ---------- */
.timeline{list-style:none;padding:0;position:relative;margin-left:var(--sp-3)}
.timeline li{position:relative;padding:0 0 var(--sp-5) var(--sp-7);border-left:1px solid var(--border-default)}
.timeline li::before{content:"";position:absolute;left:-5px;top:2px;width:9px;height:9px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 0 0 1px var(--border-default)}
.timeline li .tl-date{font-size:12px;color:var(--text-s)}
.timeline li .tl-text{font-size:13px;margin-top:var(--sp-1)}
.timeline li .tl-author{font-size:12px;color:var(--text-t)}

/* ---------- Calendario ---------- */
.cal{width:100%;border-collapse:collapse;font-size:13px}
.cal th{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--text-s);padding:8px 4px;text-align:center}
.cal td{border:1px solid var(--border-subtle);height:64px;width:14.28%;vertical-align:top;padding:4px 6px;text-align:right;font-size:12px;color:var(--text-s)}
.cal td.today{outline:2px solid var(--brand);outline-offset:-2px}
.cal td.other{background:var(--bg-subtle);color:var(--text-d)}
.cal .ev{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--text-p);text-align:left;margin-top:2px;padding:1px 4px;border-radius:4px;white-space:nowrap;overflow:hidden}
.cal .ev .dot{width:6px;height:6px;border-radius:50%;flex:none}
.cal .ev.pago{background:var(--succ-bg)} .cal .ev.pago .dot{background:var(--succ)}
.cal .ev.visita{background:var(--info-bg)} .cal .ev.visita .dot{background:var(--info)}
.cal .ev.contrato{background:var(--warn-bg)} .cal .ev.contrato .dot{background:var(--warn)}

/* ---------- Diálogo / Drawer / Toast ---------- */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:400;display:flex;align-items:center;justify-content:center;padding:20px}
.overlay.bottom-sheet{align-items:flex-end;padding:0}
.modal{background:#fff;border-radius:var(--radius-xl);box-shadow:var(--shadow-xl);width:480px;max-width:100%;max-height:calc(100vh - 40px);display:flex;flex-direction:column;outline:none}
.modal.lg{width:640px}.modal.xl{width:860px}.modal.w520{width:520px}.modal.w560{width:560px}.modal.no-pad .modal-body{padding:0}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-5) var(--sp-6);border-bottom:1px solid var(--border-subtle)}
.modal-title{font-size:16px;font-weight:600}
.modal-body{padding:var(--sp-6);overflow-y:auto}
.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-3);padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border-subtle)}
.drawer{position:fixed;top:0;right:0;bottom:0;width:480px;max-width:100%;background:#fff;box-shadow:var(--shadow-xl);z-index:400;display:flex;flex-direction:column;outline:none}
.drawer.w360{width:360px}.drawer.w720{width:720px}
.drawer-head{display:flex;align-items:center;justify-content:space-between;padding:var(--sp-5) var(--sp-6);border-bottom:1px solid var(--border-subtle)}
.drawer-title{font-size:16px;font-weight:600}
.drawer-body{padding:20px;overflow-y:auto;flex:1}
.drawer-foot{display:flex;align-items:center;justify-content:flex-end;gap:var(--sp-3);padding:var(--sp-4) var(--sp-6);border-top:1px solid var(--border-subtle)}
.toast-wrap{position:fixed;top:var(--sp-5);right:var(--sp-5);z-index:500;display:flex;flex-direction:column;gap:var(--sp-3);width:360px;max-width:calc(100vw - 32px)}
.toast{background:#fff;border:1px solid var(--border-subtle);border-left:4px solid var(--neutral);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:var(--sp-4) var(--sp-5);display:flex;align-items:flex-start;gap:var(--sp-3);font-size:13px;animation:slideIn var(--dur-3) var(--ease, cubic-bezier(.2,0,0,1))}
@keyframes slideIn{from{transform:translateX(20px);opacity:0}to{transform:none;opacity:1}}
.toast svg{width:18px;height:18px;margin-top:1px}
.toast-success{border-left-color:var(--succ)} .toast-success svg{color:var(--succ)}
.toast-error{border-left-color:var(--danger)} .toast-error svg{color:var(--danger)}
.toast-warning{border-left-color:var(--warn)} .toast-warning svg{color:var(--warn)}
.toast-info{border-left-color:var(--info)} .toast-info svg{color:var(--info)}
.toast .t-title{font-weight:600;font-size:13px}
.toast .t-close{margin-left:auto;background:none;border:none;color:var(--text-s);cursor:pointer;display:inline-flex;padding:2px}
.toast .t-close svg{width:14px;height:14px}

/* ---------- Estados ---------- */
.empty{text-align:center;padding:var(--sp-10) var(--sp-7);color:var(--text-s)}
.empty .ic-circle{width:48px;height:48px;border-radius:50%;background:var(--bg-subtle);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-5);color:var(--text-s)}
.empty .ic-circle svg{width:24px;height:24px}
.empty h3{font-size:16px;font-weight:600;color:var(--text-p);margin-bottom:var(--sp-2)}
.empty p{font-size:13px;max-width:380px;margin:0 auto var(--sp-5)}
.err-state{text-align:center;padding:var(--sp-10) var(--sp-7)}
.err-state .ic-circle{width:48px;height:48px;border-radius:50%;background:var(--danger-bg);display:flex;align-items:center;justify-content:center;margin:0 auto var(--sp-5);color:var(--danger)}
.err-state h3{font-size:16px;font-weight:600;margin-bottom:var(--sp-2)}
.err-state p{font-size:13px;color:var(--text-s);margin:0 auto var(--sp-2);max-width:420px}
.trace-id{font-family:var(--font-mono);font-size:12px;color:var(--text-t)}
.guard{max-width:420px;margin:48px auto;text-align:center;color:var(--text-s)}
.guard .ic-circle{width:48px;height:48px;border-radius:50%;background:var(--warn-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:var(--warn)}
.guard h2{font-size:16px;font-weight:600;color:var(--text-p);margin-bottom:4px}
.guard p{font-size:14px;margin-bottom:var(--sp-5)}
.skeleton{background:linear-gradient(90deg,var(--n100) 25%,var(--n200) 50%,var(--n100) 75%);background-size:200% 100%;animation:shimmer 1.4s infinite}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-row{height:14px;border-radius:4px;margin-bottom:var(--sp-3)}
.sk-card{height:96px;border-radius:var(--radius-lg);margin-bottom:var(--sp-5)}
.sk-kpi{height:110px;border-radius:var(--radius-lg)}

/* ---------- Alerta ---------- */
.alert{display:flex;align-items:flex-start;gap:var(--sp-4);padding:var(--sp-4) var(--sp-5);border-radius:var(--radius-lg);border:1px solid;font-size:13px;margin-bottom:var(--sp-5)}
.alert svg{width:20px;height:20px;margin-top:1px;flex:none}
.alert h4{font-size:14px;font-weight:600;margin-bottom:2px}
.alert p{color:var(--text-s)}
.alert-info{background:var(--info-bg);border-color:var(--info-bd);color:var(--info)}
.alert-warning{background:var(--warn-bg);border-color:var(--warn-bd);color:var(--warn)}
.alert-success{background:var(--succ-bg);border-color:var(--succ-bd);color:var(--succ)}
.alert-danger{background:var(--danger-bg);border-color:var(--danger-bd);color:var(--danger)}

/* ---------- Login ---------- */
.auth-body{min-height:100vh;display:flex;flex-direction:column;background:var(--n50)}
.auth-top{height:72px;display:flex;align-items:center;gap:14px;padding:0 32px}
.auth-main{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{width:400px;max-width:100%;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);padding:32px}
.auth-title{font-size:24px;font-weight:600;margin-bottom:4px}
.auth-sub{font-size:14px;color:var(--text-s);margin-bottom:24px}
.auth-foot{text-align:center;font-size:12px;color:var(--text-t);padding:16px 0}
.divider{display:flex;align-items:center;gap:12px;color:var(--text-t);font-size:12px;margin:20px 0 12px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--border-subtle)}
.demo-user{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border-subtle);border-radius:var(--radius-md);cursor:pointer;font-size:13px;background:#fff;margin-bottom:6px;width:100%;text-align:left;transition:border-color var(--dur-1),background var(--dur-1)}
.demo-user:hover{border-color:var(--brand);background:var(--bg-subtle)}
.demo-user .avatar{width:28px;height:28px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex:none}
.demo-user .d-name{font-weight:600}
.demo-user .d-role{font-size:11px;color:var(--text-s)}

/* ---------- OTP ---------- */
.otp-row{display:flex;gap:var(--sp-3);justify-content:space-between}
.otp-input{width:48px;height:52px;text-align:center;font-size:20px;font-weight:600;border:1px solid var(--border-default);border-radius:var(--radius-md);font-family:var(--font-mono)}
.otp-input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--focus-ring);outline:none}

/* ---------- Comprobante ---------- */
.doc{font-family:var(--font-ui);background:#fff;border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:var(--sp-7);max-width:560px;margin:0 auto}
.doc-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:2px solid var(--brand);padding-bottom:var(--sp-5);margin-bottom:var(--sp-5)}
.doc-emp{font-weight:700;font-size:15px}
.doc-emp small{display:block;font-weight:400;color:var(--text-s);font-size:12px}
.doc-title{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-s);text-align:right}
.doc-folio{font-family:var(--font-mono);font-size:13px;font-weight:600;text-align:right;margin-top:var(--sp-2)}
.doc-meta{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp-3) var(--sp-7);font-size:13px;margin-bottom:var(--sp-6)}
.doc-meta dt{color:var(--text-s);font-size:12px}
.doc-meta dd{font-weight:600;margin:0}
.doc-line{display:flex;justify-content:space-between;padding:var(--sp-3) 0;border-bottom:1px solid var(--border-subtle);font-size:13px}
.doc-total{display:flex;justify-content:space-between;padding:var(--sp-3) 0;font-weight:700;font-size:15px}
.doc-foot{margin-top:var(--sp-6);font-size:11px;color:var(--text-t);border-top:1px solid var(--border-subtle);padding-top:var(--sp-4);text-align:center}
.doc-hash{font-family:var(--font-mono);font-size:12px;color:var(--text-t);text-align:center;margin-top:var(--sp-3)}

/* ---------- Alerta demo RBAC ---------- */
.rbac-note{font-size:12px;color:var(--text-t);background:var(--bg-subtle);border-radius:var(--radius-md);padding:var(--sp-3) var(--sp-4);margin-top:var(--sp-4);display:flex;gap:var(--sp-3);align-items:flex-start}
.rbac-note svg{width:14px;height:14px;margin-top:1px;flex:none}

/* ---------- Kanban ---------- */
.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:var(--sp-5)}
.kb-col{background:var(--bg-canvas);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);padding:var(--sp-4)}
.kb-col h4{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-s);display:flex;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-4)}
.kb-col h4 .count{background:#fff;border:1px solid var(--border-default);color:var(--text-s);border-radius:var(--radius-pill);padding:0 8px;font-size:11px}
.kb-card{background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);padding:var(--sp-4);margin-bottom:var(--sp-3);cursor:pointer;transition:box-shadow var(--dur-2)}
.kb-card:hover{box-shadow:var(--shadow-md)}
.kb-card .kb-top{display:flex;justify-content:space-between;align-items:center;gap:var(--sp-3);margin-bottom:var(--sp-2)}

.kb-card .btn{width:100%}
.kb-empty{padding:var(--sp-2) 0}

/* ---------- Menús dropdown ---------- */
.menu{position:absolute;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);min-width:200px;padding:var(--sp-2);z-index:450}

.menu button:hover{background:var(--bg-subtle)}
.menu button svg{width:16px;height:16px;color:var(--text-s)}
.menu .sep{height:1px;background:var(--border-subtle);margin:var(--sp-2) 0}
.menu .danger-text{color:var(--danger)}

/* ---------- Portales ---------- */
.portal-hero{background:var(--brand);color:#fff;border-radius:var(--radius-xl);padding:24px;margin-bottom:var(--sp-6)}
.portal-hero .ph-label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--scaffold-text-m)}
.portal-hero .ph-amount{font-size:30px;font-weight:600;margin:6px 0;font-variant-numeric:tabular-nums}
.portal-hero .ph-due{font-size:13px;color:var(--scaffold-text-m);margin-bottom:14px}
.portal-hero .btn-primary{background:#fff;color:var(--brand)}
.portal-hero .btn-primary:hover{background:var(--n100)}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border-subtle);height:64px;z-index:350;align-items:stretch;justify-content:space-around}
.bottom-nav a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--text-s);text-decoration:none;min-height:44px}
.bottom-nav a svg{width:20px;height:20px}
.bottom-nav a.active{color:var(--brand);font-weight:600}
.hamburger{display:none}

/* ---------- Responsive ---------- */
@media (max-width:1279px){
  .kpis{grid-template-columns:repeat(auto-fit,minmax(0,1fr))}
  .g4{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:959px){

/* ---------- Persistencia de flags (kill-switch de módulos) ---------- */
const LS_FLAGS = 'grafito.feature-flags';
function ffOn(flag){ return Boolean((FEATURE_FLAGS.find(function(x){return x.flag===flag;}) || {}).activo); }
function cargarFlags(){
  try{
    var saved = localStorage.getItem(LS_FLAGS);
    if(!saved) return;
    var map = JSON.parse(saved);
    for(var i=0;i<FEATURE_FLAGS.length;i++){
      var f=FEATURE_FLAGS[i];
      if(typeof map[f.flag]==='boolean') f.activo=map[f.flag];
    }
  }catch(e){}
}
function guardarFlags(){
  try{
    var map={};
    for(var i=0;i<FEATURE_FLAGS.length;i++){ map[FEATURE_FLAGS[i].flag]=FEATURE_FLAGS[i].activo; }
    localStorage.setItem(LS_FLAGS, JSON.stringify(map));
  }catch(e){}
}

function fmtM(n){ return 'B/. ' + (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function fmtN(n){ return (Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2}); }
function persona(id){ return PERSONAS.find(function(p){return p.id===id;}) || {nombre:''}; }
function inmueble(id){ return INMUEBLES.find(function(p){return p.id===id;}) || {ref:''}; }
function contrato(id){ return CONTRATOS.find(function(p){return p.id===id;}) || {ref:''}; }
function reciboContrato(id, periodo){ return RECIBOS.find(function(r){return r.contrato===id && r.periodo===periodo;}); }
function canonOf(ref){ var c = CONTRATOS.find(function(x){return x.inm===ref && x.tipo==='Arrendamiento' && (x.estado==='Vigente'||x.estado==='Mora');}); return c? c.canon : null; }

/* ---------- RBAC demo: permisos del rol activo ---------- */
function can(module){
  if(!session || session.type!=='admin') return false;
  var r = ROLES[session.rol];
  if(!r) return false;
  if(r.all) return true;
  var req = MODULE_PERMS[module] || [];
  return req.some(function(p){ return r.perms.indexOf(p)>=0; });
}
function hasPerm(perm){
  if(!session || session.type!=='admin') return false;
  var r = ROLES[session.rol];
  return !!r && (r.all===true || r.perms.indexOf(perm)>=0);
}
function neededPerm(module){ return (MODULE_PERMS[module]||[])[0]; }

/* ---------- Avisos breves, diálogos y paneles ---------- */
function toast(msg, tipo, titulo){
  tipo = tipo || 'success';
  var icons = {success:'circlecheck', error:'alert', warning:'alert', info:'info'};
  var el = document.createElement('div');
  el.className = 'toast toast-'+tipo;
  el.setAttribute('role', tipo==='error'?'alert':'status');
  el.innerHTML = ic(icons[tipo],18) +
    '<div><div class="t-title">'+esc(titulo||(tipo==='success'?'Listo':tipo==='error'?'Error':'Aviso'))+'</div>'+
    '<div>'+msg+'</div></div>'+
    '<button class="t-close" aria-label="Cerrar aviso">'+ic('x',16)+'</button>';
  document.getElementById('toast-root').appendChild(el);
  var close = function(){ el.remove(); };
  el.querySelector('.t-close').onclick = close;
  setTimeout(close, tipo==='error'?8000:5000);
}
function overlay(action){ // action: 'open'|'close'; close removes top overlay
  var root = document.getElementById('overlay-root');
  if(action==='close'){
    var ov = root.querySelector('.overlay');
    if(ov){ ov.remove(); document.body.classList.remove('no-scroll'); }
    return;
  }
}
function openModal(html, opts){
  opts = opts || {};
  var root = document.getElementById('overlay-root');
  overlay('close');
  var ov = document.createElement('div');
  ov.className = 'overlay' + (opts.bottom?' bottom-sheet':'');
  ov.setAttribute('role','dialog');
  ov.setAttribute('aria-modal','true');
  ov.setAttribute('aria-label', opts.title || 'Diálogo');
  var modal = document.createElement('div');
  modal.className = 'modal ' + (opts.size?opts.size:'') + (opts.noPadding?' no-pad':'');
  modal.innerHTML = (opts.noHead?'':'<div class="modal-head"><div class="modal-title">'+esc(opts.title||'')+'</div>'+
    '<button class="btn-icon" onclick="closeModal()" aria-label="Cerrar">'+ic('x',20)+'</button></div>') +
    '<div class="modal-body">'+html+'</div>';
  modal.tabIndex = -1;
  ov.appendChild(modal);
  root.appendChild(ov);
  modal.focus();
  var first = modal.querySelector('input,select,textarea,button:not(.btn-icon)');
  if(first && opts.focus!==false) first.focus();
  return modal;
}
function closeModal(){
  overlay('close');
  var opener = document.querySelector('[data-last-focus]');
  if(opener) opener.focus();
}
function confirmDialog(o){
  var html = (o.icon!==false?'<div class="alert '+ (o.danger?'alert-danger':'alert-warning') +'" style="margin-bottom:16px">'+ic(o.danger?'alert':'info',20)+
    '<div><h4>'+esc(o.title||'¿Confirmar acción?')+'</h4><p>'+esc(o.body||'')+'</p></div></div>':'') +
    (o.check? '<label class="check"><input id="cf-check" type="checkbox"> '+esc(o.check)+'</label>' : '');
  var m = openModal(html, {title:o.title||'Confirmar'});
  var foot = document.createElement('div');
  foot.className = 'modal-foot';
  foot.innerHTML = '<button class="btn btn-secondary" onclick="closeModal()">'+esc(o.cancelLabel||'Cancelar')+'</button>'+
    '<button class="btn '+(o.danger?'btn-danger':'btn-primary')+'" id="cf-ok">'+esc(o.okLabel||'Confirmar')+'</button>';
  m.querySelector('.modal-body').after(foot);
  m.querySelector('#cf-ok').onclick = function(){
    if(o.check){
      var chk = document.getElementById('cf-check');
      if(!chk || !chk.checked){ toast('Debes confirmar la casilla para continuar.','warning','Verificación requerida'); return; }
    }
    closeModal();
    o.onOk && o.onOk();
  };
}
function openDrawer(html, opts){
  opts = opts || {};
  var root = document.getElementById('overlay-root');
  overlay('close');
  var ov = document.createElement('div');
  ov.className = 'overlay side';
  ov.setAttribute('role','dialog');
  ov.setAttribute('aria-modal','true');
  ov.setAttribute('aria-label', opts.title || 'Panel');
  var dr = document.createElement('div');
  dr.className = 'drawer ' + (opts.size||'');
  dr.innerHTML = '<div class="drawer-head"><div class="drawer-title">'+esc(opts.title||'')+'</div>'+

  dr.tabIndex = -1;
  ov.appendChild(dr);
  root.appendChild(ov);
  dr.focus();
}

/* ---------- Descarga CSV (funcional) ---------- */
function downloadCSV(nombre, cabeceras, filas){
  var lines = [cabeceras.map(esc).join(';')].concat(filas.map(function(f){return f.map(function(c){return '"'+String(c==null?'':c).replace(/"/g,'""')+'"';}).join(';');}));
  var blob = new Blob(["\uFEFF"+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre+'.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Exportación generada: '+nombre+'.csv','success','Archivo listo');
}

function parseRoute(){
  var h = location.hash.replace(/^#\/?/,'') || '';
  var parts = h.split('/').filter(Boolean);
  if(!parts.length) return {area:'home'};
  if(parts[0]==='login' || parts[0]==='olvide-contrasena' || parts[0]==='verificacion-otp' || parts[0]==='restablecer-contrasena') return {area:'auth', view:parts[0]};
  if(parts[0]==='app') return {area:'app', view:parts[1]||'resumen', sub:parts[2]||null};
  if(parts.length>=3 && parts[0]==='portal') return {area:'portal', portal:parts[1], view:parts[2]||'resumen', sub:parts[3]||null};
  return {area:'home'};
}
function goHome(){
  if(!session){ location.hash = '#/login'; return; }

function checkRules(p){
  var ok = {min:p.length>=8, may:/[A-Z]/.test(p), num:/\d/.test(p), sym:/[^A-Za-z0-9]/.test(p)};
  var ids = {min:'r-min', may:'r-may', num:'r-num', sym:'r-sym'};
  Object.keys(ok).forEach(function(k){
    var el = document.getElementById(ids[k]);
    if(el){
      el.style.color = ok[k] ? 'var(--succ)' : 'var(--text-s)';
      el.textContent = (ok[k]?'✓ ':'• ') + el.textContent.replace(/^[✓•]\s*/,'');
    }
  });
  return ok.min && ok.may && ok.num && ok.sym;
}
function doReset(e){
  e.preventDefault();
  var p = document.getElementById('rs-pass').value;
  var p2 = document.getElementById('rs-pass2').value;
  var matchEl = document.getElementById('rs-match');
  var rulesOk = checkRules(p);
  matchEl.hidden = p===p2 || !p2;
  if(!rulesOk){ toast('La contraseña no cumple los requisitos mínimos.','warning','Revisa la contraseña'); return; }
  if(p!==p2){ matchEl.hidden = false; toast('Las contraseñas no coinciden.','error','Verifica'); return; }
  document.getElementById('f-res').hidden = true;
  document.getElementById('res-ok').hidden = false;
  toast('Contraseña restablecida. Ya puedes iniciar sesión.','success','¡Listo!');
  setTimeout(function(){ location.hash = '#/login'; }, 1800);
}

function svgBars(values, labels, highlight){
  var w=560,h=170,pad=8,bw=(w-40)/values.length,max=Math.max.apply(null,values);
  var bars = values.map(function(v,i){
    var bh=Math.max(2,(v/max)*(h-40));
    var fill = (highlight && i===highlight)? '#1B212B' : '#7C8694';
    var op = (highlight && i===highlight)? ' style="filter:brightness(1)"':'';
    return '<rect x="'+(20+i*bw+4)+'" y="'+(h-pad-bh)+'" width="'+(bw-8)+'" height="'+bh+'" rx="3" fill="'+(i===highlight?'#2456CC':'#C0C7D1')+'">'+
      '<title>'+labels[i]+' · '+fmtM(v)+'</title></rect>';
  }).join('');
  var guide = [];
  for(var g=0;g<=3;g++){ var gy=h-pad-((h-40)*g/3); guide.push('<line x1="20" y1="'+gy+'" x2="'+(w-20)+'" y2="'+gy+'" stroke="#E3E6EB" stroke-width="1"/>'); }
  return '<svg viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Cobros últimos 12 meses">'+guide.join('')+bars+'</svg>';
}

    if(q && p.nombre.toLowerCase().indexOf(q)<0 && p.ci.toLowerCase().indexOf(q)<0 && p.mail.toLowerCase().indexOf(q)<0) return false;

    return true;
  });

function guardarCliente(){
  var nom = document.getElementById('nc-nom').value.trim();
  var tipo = document.getElementById('nc-tipo').value;
  var ci = document.getElementById('nc-ci').value.trim();
  var err = document.getElementById('cli-err');
  if(!nom || !tipo || !ci){ err.hidden=false; err.focus(); toast('Completa nombre, tipo y cédula.','warning','Datos incompletos'); return; }
  if(PERSONAS.some(function(p){return p.ci===ci;})){ toast('Ya existe un cliente con la cédula '+ci+'.','error','Documento duplicado'); return; }
  var inmSel = document.getElementById('nc-inm').value;
  if(inmSel){ var inmObj = inmueble(inmSel); if(!inmObj.ref || (inmObj.estado!=='Disponible'&&inmObj.estado!=='Reservado')){ toast('La unidad seleccionada no está disponible para asignación (RD-INM-05 / RN-I1).','error','Inmueble ocupado'); return; } }
  var inis = nom.split(' ').map(function(w){return w[0];}).join('').slice(0,2).toUpperCase();
  PERSONAS.push({id:'p'+Date.now(), ini:inis, nombre:nom, tipo:tipo, ci:ci, cel:document.getElementById('nc-cel').value, mail:document.getElementById('nc-mail').value, trab:document.getElementById('nc-trab').value, nac:document.getElementById('nc-nac').value, ciudad:document.getElementById('nc-ciudad').value, fc:'—', civil:'—', notas:document.getElementById('nc-notas').value, inm:inmSel||null, estado:'Activo', fechaRegistro:new Date().toLocaleDateString('es-PA')});
  closeModal(); cliRefresh(); cliChips();
  toast('Cliente registrado correctamente (estado Activo).','success','Cliente creado');
}

function candadosCliente(id){
  var activos = CONTRATOS.filter(function(c){ return c.persona===id && (c.estado==='Vigente'||c.estado==='Mora'); });
  var pend = RECIBOS.filter(function(r){ return activos.some(function(c){ return c.id===r.contrato; }) && (r.estado==='Emitido'||r.estado==='En mora'); });
  return {contratos:activos, recibos:pend};
}
function cambiarEstadoCliente(id){
  var p = persona(id);
  if(p.estado==='Inactivo'){
    confirmDialog({
      title:'Reactivar cliente',
      body:'El cliente podrá volver a firmar alquileres y reportar incidencias. El estado Mora se recalcula automáticamente al registrar pagos.',
      danger:false, okLabel:'Reactivar', cancelLabel:'Cancelar',
      onOk:function(){
        p.estado='Activo';
        cliRefresh();
        toast('El estado de '+p.nombre+' cambió a Activo.','success','Actualizado');
      }
    });
    return;
  }
  var c = candadosCliente(id);
  if(c.contratos.length || c.recibos.length){
    var motivos=[];
    if(c.contratos.length) motivos.push(c.contratos.length+' alquiler(es) activo(s): '+c.contratos.map(function(x){return x.ref;}).join(', '));
    if(c.recibos.length) motivos.push(c.recibos.length+' recibo(s) sin cobrar');
    var m = openModal('<div class="alert alert-danger">'+ic('alert',20)+'<div><h4>Desactivación bloqueada</h4><p>No se puede desactivar a <strong>'+esc(p.nombre)+'</strong> mientras tenga <strong>'+motivos.join(' y ')+'</strong>.</p><p class="small muted">Primero termina los alquileres vigentes o registra los pagos pendientes (RD-CLI-07 / RN-C6).</p></div></div>',{title:'Estado — '+p.nombre});
    var foot=document.createElement('div'); foot.className='modal-foot';
    foot.innerHTML='<button class="btn btn-primary" onclick="closeModal()">Entendido</button>';
    m.querySelector('.modal-body').after(foot);
    return;
  }
  confirmDialog({
    title:'Desactivar cliente',
    body:'Se bloquearán nuevos alquileres, incidencias y notificaciones para '+p.nombre+'. La acción queda registrada en auditoría y puede revertirse reactivando al cliente.',
    danger:true, okLabel:'Desactivar cliente', cancelLabel:'Cancelar',
    onOk:function(){
      p.estado='Inactivo';
      cliRefresh(); cliChips();
      toast('El cliente '+p.nombre+' pasó a Inactivo.','success','Actualizado');
    }
  });
}

function subirDocContrato(id, inp){
  var c=contrato(id);
  if(!c||!inp.files||!inp.files.length) return;
  var f=inp.files[0];
  if(f.size>10*1024*1024){ toast('El archivo excede 10 MB.','warning','Archivo grande'); inp.value=''; return; }
  var r=new FileReader();
  r.onload=function(){
    var d={id:'doc'+Date.now(), ref:c.ref, persona:c.persona, tipo:'Documento adicional', nombre:f.name, size:f.size, dataUrl:r.result, fecha:todayStr(), usuario:session&&session.user?session.user.nombre:'Admin'};
    DOCUMENTOS.push(d);
    if(!c.docs) c.docs=[];
    c.docs.push(d.id);
    closeModal(); renderContratoDrawer(id);
    toast('Documento adjuntado al alquiler '+c.ref+'.','success','Documento subido');
  };
  r.readAsDataURL(f);
}

function leerArchivo(file){
  return new Promise(function(resolve,reject){
    var r=new FileReader();
    r.onload=function(){ resolve(r.result); };
    r.onerror=function(){ reject(new Error('No se pudo leer el archivo adjunto.')); };
    r.readAsDataURL(file);
  });
}

  if(!personaSel||!inmSel){var e=document.getElementById('nc2-err');if(e)e.hidden=false;toast('Selecciona cliente e inmueble.','warning','Datos incompletos');return;}
  var p=persona(personaSel);
  if(t==='Arrendamiento' && (p.tipo==='Propietario')){ toast('El cliente debe ser Inquilino o Ambos para un contrato de arrendamiento (RD-CON-03).','error','Tipo incompatible'); return; }
  if(t==='Administración' && (p.tipo==='Inquilino')){ toast('El cliente debe ser Propietario o Ambos para un contrato de administración.','error','Tipo incompatible'); return; }
  var inm=inmueble(inmSel);
  if(inm.estado!=='Disponible'&&inm.estado!=='Reservado'){ toast('El inmueble no está disponible para un contrato nuevo (RN-I1).','error','Inmueble ocupado'); return; }
  if(CONTRATOS.some(function(c){return c.inm===inmSel&&c.tipo===t&&(c.estado==='Vigente'||c.estado==='Mora');})){ toast('Ya existe un contrato vigente sobre ese inmueble (RD-CON-02).','error','Unicidad activa'); return; }
  var canon=t==='Arrendamiento'?+document.getElementById('nc2-canon').value:null;
  if(canon && canon<=0){ toast('El canon debe ser mayor a 0.','error','Canon inválido'); return; }
  var docInp=document.getElementById('nc2-doc');
  var docSel=docInp&&docInp.files&&docInp.files.length?docInp.files[0]:null;
  if(t==='Arrendamiento' && !docSel){ toast('Debes adjuntar el contrato firmado (PDF o imagen) antes de crear el contrato (RF-CON-07).','error','Documento requerido'); return; }
  if(docSel && docSel.size>10*1024*1024){ toast('El archivo del contrato excede 10 MB.','error','Archivo grande'); return; }
  var dataUrl=null;
  if(docSel){ try{ dataUrl=await leerArchivo(docSel); }catch(e){ toast(e.message,'error','Lectura'); return; } }
  var n=CONTRATOS.filter(function(c){return c.ref.indexOf('ARR-2026')===0||c.ref.indexOf('ADM-2026')===0;}).length+1;
  var id='c'+Date.now();
  var ref=(t==='Arrendamiento'?'ARR':'ADM')+'-2026-'+String(n).padStart(3,'0');
  var nuevo={id:id,ref:ref,tipo:t,persona:personaSel,inm:inmSel,canon:canon,moneda:'USD (B/.)',ini:document.getElementById('nc2-ini').value,fin:document.getElementById('nc2-fin').value,dia:t==='Arrendamiento'?+document.getElementById('nc2-dia').value:null,garantia:t==='Arrendamiento'?document.getElementById('nc2-gar').value:'—',estado:'Vigente',itbms:t==='Arrendamiento'?document.getElementById('nc2-itbms').value:'—',comision:t==='Administración'?document.getElementById('nc2-com').value+'%':null,renovaciones:0,motivo:null,docs:[]};
  var dc=null;
  if(docSel){
    dc={id:'doc'+Date.now(), ref:ref, persona:personaSel, tipo:'Contrato firmado', nombre:docSel.name, size:docSel.size, dataUrl:dataUrl, fecha:todayStr(), usuario:session&&session.user?session.user.nombre:'Admin'};
    DOCUMENTOS.push(dc);
    nuevo.docs=[dc.id];
  }
  CONTRATOS.push(nuevo);
  if(t==='Arrendamiento') inm.estado='Alquilado';
  closeModal(); conRefresh();
  toast('Alquiler '+ref+' creado en estado Vigente. El inmueble pasó a Alquilado'+(dc?' y el contrato firmado quedó adjunto.':'.'),'success','Alquiler creado');
}

        candidatos.map(function(c){
          var itbms = c.itbms && c.itbms.indexOf('7%')>=0 ? 7 : 0;
          var total = c.canon + (c.canon*itbms/100);
          return '<tr><td class="mono">'+esc(c.ref)+'</td><td>'+esc(persona(c.persona).nombre)+'</td><td>'+esc(inmueble(c.inm).ref)+'</td><td class="num mono">'+fmtM(c.canon)+'</td><td class="num mono">'+fmtM(total)+'</td></tr>';
        }).join('')+'</tbody></table></div>'
      : '<p class="small muted2">No hay contratos de arrendamiento vigentes sin recibo para este período.</p>')+
    '</div>';
  var m=openModal(html,{title:'Generar recibos', size:'lg'});
  var foot=document.createElement('div');foot.className='modal-foot';
  foot.innerHTML='<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" id="gr-ok" '+(candidatos.length?'':'disabled')+'>'+ic('plus')+' Generar '+candidatos.length+' recibos</button>';
  m.querySelector('.modal-body').after(foot);
  m.querySelector('#gr-ok').onclick=function(){
    var per=document.getElementById('gr-per').value.trim();
    var vence=document.getElementById('gr-vence').value.trim();
    if(!per){ toast('Indica el período a facturar.','warning','Datos incompletos'); return; }
    var mesNum=(MESES.indexOf(per.split(' ')[0])+1)||0;
    if(!mesNum){ toast('Formato de período esperado: «Octubre 2026».','warning','Período inválido'); return; }
    var nuevos=CONTRATOS.filter(function(c){
      if(c.tipo!=='Arrendamiento') return false;
      if(c.estado!=='Vigente'&&c.estado!=='Mora') return false;
      return !RECIBOS.some(function(r){return r.contrato===c.id && r.periodo===per;});
    });
    if(!nuevos.length){ toast('Ya existen recibos para todos los alquileres vigentes en '+per+'.','warning','Sin candidatos'); return; }
    nuevos.forEach(function(c){
      var itbms = c.itbms && c.itbms.indexOf('7%')>=0 ? 7 : 0;
      var total = c.canon + (c.canon*itbms/100);
      RECIBOS.push({folio:nextRecFolio(), contrato:c.id, periodo:per, vence:vence||(c.dia||30)+'/'+String(mesNum).padStart(2,'0')+'/'+per.split(' ')[1], monto:Math.round(total*100)/100, estado:'Emitido', pago:null, metodo:null, comp:null, refComp:null, itbms:itbms, dias:0, notas:''});
    });
    V.cobros.periodo=per; V.cobros.page=1;
    closeModal(); cobRefresh(); cobChips();
    toast('Se generaron '+nuevos.length+' recibos para '+per+' en estado Emitido.','success','Recibos creados');
  };

function registrarPago(folio){
  var r = folio ? RECIBOS.find(function(x){return x.folio===folio;}) : null;
  var select = '';
  if(!r){
    select = '<div class="field"><label for="pg-recibo">Recibo <span class="req">*</span></label><select class="input" id="pg-recibo">'+
      RECIBOS.filter(function(x){return x.estado==='Emitido'||x.estado==='En mora';}).map(function(x){return '<option value="'+x.folio+'">'+x.folio+' · '+esc(contrato(x.contrato).ref)+' · '+fmtM(x.monto)+'</option>';}).join('')+'</select></div>';
  }
  var rSel=r?null:RECIBOS.find(function(x){return x.estado==='Emitido'||x.estado==='En mora';});
  var html=(r?'':'<div class="alert alert-info">'+ic('info',20)+'<div><h4>Registro de pago</h4><p>Selecciona el recibo a cobrar; el sistema valida que no esté pagado ni anulado.</p></div></div>')+
    select+
    '<div class="field"><label for="pg-monto">Monto <span class="req">*</span></label><input class="input" id="pg-monto" type="number" step="0.01" value="'+(r?r.monto:(rSel?rSel.monto:''))+'" aria-label="Monto"></div>'+
    '<div class="form-grid" style="grid-template-columns:1fr 1fr">'+
      '<div class="field"><label for="pg-fecha">Fecha de pago <span class="req">*</span></label><input class="input" id="pg-fecha" value="'+todayStr()+'" aria-label="Fecha de pago"></div>'+
      '<div class="field"><label for="pg-metodo">Método <span class="req">*</span></label><select class="input" id="pg-metodo"><option>Transferencia</option><option>Punto de venta</option><option>Efectivo</option><option>Ventanilla</option></select></div>'+
    '</div>'+
    '<div class="field"><label for="pg-ref">Comprobante externo (opcional)</label><input class="input" id="pg-ref" placeholder="ABC-123456 / POS-8842" aria-label="Comprobante externo"></div>'+
    '<div class="field"><label for="pg-notas">Notas (opcional)</label><textarea class="input" id="pg-notas" rows="2" placeholder="Observaciones del cobro…"></textarea></div>';
  var m=openModal(html,{title:r?'Registrar pago — '+r.folio:'Registrar pago'});
  var foot=document.createElement('div');foot.className='modal-foot';
  foot.innerHTML='<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" id="pg-ok">'+ic('check')+' Confirmar pago</button>';
  m.querySelector('.modal-body').after(foot);
  m.querySelector('#pg-ok').onclick=function(){
    var rec = document.getElementById('pg-recibo');
    var target = r || (rec?RECIBOS.find(function(x){return x.folio===rec.value;}):null);
    if(!target){ toast('Selecciona un recibo válido.','warning','Datos incompletos'); return; }
    if(target.estado==='Pagado'){ toast('El recibo '+target.folio+' ya se encuentra pagado.','warning','Estado inválido'); return; }
    if(target.estado==='Anulado'){ toast('No se puede pagar un recibo anulado.','error','Estado inválido'); return; }
    var monto=+document.getElementById('pg-monto').value;
    if(!(monto>0)){ toast('El monto debe ser mayor a 0 (RD-COB-02).','warning','Monto inválido'); return; }
    target.monto=monto;
    target.pago=document.getElementById('pg-fecha').value||todayStr();
    target.metodo=document.getElementById('pg-metodo').value;
    target.refComp=document.getElementById('pg-ref').value||null;
    target.notas=document.getElementById('pg-notas').value||'';
    target.estado='Pagado';
    target.comp=nextCompCre();
    target.dias=0;
    var c=contrato(target.contrato);
    if(c && c.estado==='Mora'){
      var otros=RECIBOS.filter(function(x){return x.contrato===c.id && x.estado==='En mora';});
      if(!otros.length){ c.estado='Vigente'; }
    }
    var p=persona(c.persona);
    if(p && p.estado==='Mora') p.estado='Activo';
    ASIENTOS.push({num:'A-'+String(ASIENTOS.length+1).padStart(3,'0'), fecha:target.pago, periodo:target.periodo, desc:'Pago de alquiler — '+inmueble(c.inm).ref, ref:target.folio, estado:'Borrador', lineas:[{cuenta:'1110', nombre:'Banco', debe:monto, haber:0},{cuenta:'4101', nombre:'Ingresos por arrendamiento', debe:0, haber:monto}]});
    closeModal(); cobRefresh();
    toast('Pago registrado en '+target.folio+' · comprobante '+target.comp+'. Se creó asiento de caja como borrador (FL-COB-04).','success','Pago confirmado');
  };
}
function anularRecibo(folio){

  var m=openModal('<div class="alert alert-danger">'+ic('alert',20)+'<div><h4>Anulación de recibo</h4><p>El folio '+esc(folio)+' dejará de impactar ingresos y no se reutiliza (RD-COB-05).</p></div></div>'+

function generarLiquidacionModal(){
  var adms=CONTRATOS.filter(function(c){return c.tipo==='Administración' && c.estado==='Vigente';});
  if(!adms.length){ toast('No hay contratos de administración vigentes.','warning','Sin base'); return; }
  var html='<div class="alert alert-info">'+ic('info',20)+'<div><h4>Generación</h4><p>La liquidación se crea <b>Pendiente</b> y libera el período si se anula (RF-LIQ-05). No se puede duplicar por contrato y período (RD-LIQ-02).</p></div></div>'+
    '<div class="field"><label for="gl-con">Contrato de administración <span class="req">*</span></label><select class="input" id="gl-con">'+
      adms.map(function(c){return '<option value="'+c.id+'">'+c.ref+' · '+esc(persona(c.persona).nombre)+' · '+esc(inmueble(c.inm).ref)+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label for="gl-per">Período <span class="req">*</span></label><select class="input" id="gl-per"><option>Septiembre 2026</option><option>Agosto 2026</option><option>Octubre 2026</option></select></div>';
  var m=openModal(html,{title:'Generar liquidación'});
  var foot=document.createElement('div');foot.className='modal-foot';
  foot.innerHTML='<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" id="gl-ok">'+ic('plus')+' Calcular y crear</button>';
  m.querySelector('.modal-body').after(foot);
  m.querySelector('#gl-ok').onclick=function(){
    var cid=document.getElementById('gl-con').value;
    var per=document.getElementById('gl-per').value;
    var c=contrato(cid), i=inmueble(c.inm);
    if(LIQUIDACIONES.some(function(l){return l.contrato===cid && l.periodo===per;})){ toast('Ya existe una liquidación para ese contrato y período (RD-LIQ-02).','warning','Duplicado'); return; }
    var ingreso=RECIBOS.filter(function(r){ var cc=contrato(r.contrato); return cc.inm===i.id && r.periodo===per && r.estado==='Pagado'; }).reduce(function(a,r){return a+r.monto;},0);
    if(!(ingreso>0)){ toast('No hay ingresos cobrados en '+per+' para '+i.ref+' (FL-LIQ-02).','warning','Sin base de ingreso'); return; }
    var tasa=parseInt((c.comision||'8%').replace('%',''),10)||0;
    var comision=Math.round(ingreso*tasa/100*100)/100;
    var neto=Math.round((ingreso-comision)*100)/100;
    LIQUIDACIONES.push({ref:nextLiqFolio(), contrato:cid, prop:c.persona, inm:i.id, periodo:per, ingreso:ingreso, comision:comision, neto:neto, estado:'Pendiente', pago:null, metodo:null});
    closeModal(); liqRefresh();
    toast('Liquidación creada: ingreso '+fmtM(ingreso)+' − comisión '+fmtM(comision)+' = neto '+fmtM(neto)+'.','success','Liquidación pendiente');
  };
}
function confirmarPagoLiq(ref){
  var l=LIQUIDACIONES.find(function(x){return x.ref===ref;});
  if(!l) return;
  var m=openModal('<div class="alert alert-info">'+ic('info',20)+'<div><h4>Confirmar pago</h4><p>Se registrará la transferencia de <b>'+fmtM(l.neto)+'</b> a '+esc(persona(l.prop).nombre)+'.</p></div></div>'+
    '<div class="form-grid" style="grid-template-columns:1fr 1fr">'+
      '<div class="field"><label for="lp-fecha">Fecha <span class="req">*</span></label><input class="input" id="lp-fecha" value="'+todayStr()+'" aria-label="Fecha de pago"></div>'+
      '<div class="field"><label for="lp-metodo">Método <span class="req">*</span></label><select class="input" id="lp-metodo"><option>Transferencia</option><option>Cheque</option><option>Efectivo</option></select></div>'+
    '</div>', {title:'Confirmar pago — '+ref});
  var foot=document.createElement('div');foot.className='modal-foot';
  foot.innerHTML='<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" id="lp-ok">'+ic('check')+' Confirmar</button>';

    l.pago=document.getElementById('lp-fecha').value||todayStr();
    l.metodo=document.getElementById('lp-metodo').value;
    l.estado='Pagado';
    ASIENTOS.push({num:'A-'+String(ASIENTOS.length+1).padStart(3,'0'), fecha:l.pago, periodo:l.periodo, desc:'Pago a propietario — '+persona(l.prop).nombre, ref:l.ref, estado:'Borrador', lineas:[{cuenta:'2200', nombre:'Cuentas por pagar propietarios', debe:l.neto, haber:0},{cuenta:'1110', nombre:'Banco', debe:0, haber:l.neto}]});
    closeModal(); liqRefresh();
    toast('Pago confirmado para '+ref+'. Se generó asiento de egreso como borrador (FL-LIQ-03).','success','Liquidación pagada');

}
function anularLiquidacion(ref){
  var l=LIQUIDACIONES.find(function(x){return x.ref===ref;});
  if(!l) return;
  if(l.estado!=='Pendiente'){ toast('Solo se anula una liquidación Pendiente (RD-LIQ-03).','error','Acción no permitida'); return; }
  confirmDialog({
    title:'Anular liquidación '+ref, danger:true, okLabel:'Anular y liberar',
    body:'El período quedará liberado para regenerar la liquidación (FL-LIQ-01). El neto de '+fmtM(l.neto)+' no se transferirá.',
    onOk:function(){ l.estado='Anulado'; liqRefresh(); toast('Liquidación '+ref+' anulada; período liberado.','success','Anulada'); }
  });
}

  var html='<div class="alert alert-info">'+ic('info',20)+'<div><h4>Cierre</h4><p>Se registrará el costo final (puede ser 0 si el proveedor no cobró) y la incidencia pasará a <b>Cerrada</b>.</p></div></div>'+

  m.querySelector('#ci-ok').onclick=function(){
    var costo=+document.getElementById('ci-costo').value;
    if(!(costo>=0)){ toast('El costo final debe ser mayor o igual a 0.','warning','Costo inválido'); return; }
    i.costo=costo;
    i.timeline.push({f:nowStr(), t:'Cerrada · '+fmtM(costo), a:session.user.nombre+' · Admin'});
    i.estado='Cerrada';
    var chk=document.getElementById('ci-lb');
    if(chk && chk.checked){
      var eq=EQUIPOS.find(function(e){return e.inm===i.inm && e.cat===i.cat && e.estado!=='De baja';});
      if(eq){
        eq.mants.push({f:todayStr(), t:'Correctivo', costo:costo, prov:i.tecnico, res:document.getElementById('ci-nota').value||'Cierre de incidencia '+i.id, sig:null});
        eq.estado='En reparación'; eq.proxMant=null; eq.ultMant=todayStr();

      }
    }
    closeModal(); incRefresh();
    toast('Incidencia '+i.id+' cerrada. Estado final registrado en el timeline (RD-INC-04).','success','Incidencia cerrada');
  };
}

V.lb = {q:'', estado:'', page:1, per:25};
function lbFiltrados(){
  var s=V.lb, q=s.q.trim().toLowerCase();
  return EQUIPOS.filter(function(e){
    if(q && e.id.toLowerCase().indexOf(q)<0 && (e.marca+' '+e.modelo).toLowerCase().indexOf(q)<0 && (inmueble(e.inm).ref||'').toLowerCase().indexOf(q)<0) return false;
    if(s.estado && e.estado!==s.estado) return false;
    return true;
  });
}
function lbProximos(){
  var ref=new Date(2026,9,15); // 15/10/2026 como horizonte
  return EQUIPOS.filter(function(e){
    if(e.estado==='De baja'||!e.proxMant) return false;
    var d=parseDMY(e.proxMant);
    return d && d<=ref;
  });
}

  var inst=EQUIPOS.filter(function(e){return e.estado==='Instalado';});

  html += '<div class="kpis">'+
    '<div class="card stat-card"><div class="stat-label">Instalados</div><div class="stat-value">'+inst.length+'</div><div class="stat-meta">'+EQUIPOS.length+' equipos totales</div></div>'+

    '<div class="card stat-card"><div class="stat-label">Próximos preventivos</div><div class="stat-value '+(prox.length?'v-warn':'')+'">'+prox.length+'</div><div class="stat-meta">Vencidos o antes del 15/10/2026</div></div>'+

/* ============================================================
   Utilidades de paginación (diseño: 1–25 de N · ‹ › · 25/50/100)
   ============================================================ */
function slicePage(s, rows){
  var per=s.per||25, total=rows.length;
  s._total=total;
  if((s.page||1)*per>total && total>0) s.page=Math.max(1, Math.ceil(total/per));
  return rows.slice(((s.page||1)-1)*per, ((s.page||1)-1)*per+per);
}
function pagBar(id, total, per, page, refreshFn){
  per = per||25; page = page||1;
  var pages=Math.max(1, Math.ceil(total/per));
  var from=total?((page-1)*per+1):0;
  var to=Math.min(total, page*per);
  // Botones numéricos de página (ventana de 7, con elipsis si hay más)
  var btns='';
  var win=[];
  if(pages<=7){ for(var i=1;i<=pages;i++) win.push(i); }
  else{
    win.push(1);
    if(page>4) win.push('…');
    for(var j=Math.max(2,page-1); j<=Math.min(pages-1,page+1); j++) win.push(j);
    if(page<pages-3) win.push('…');
    win.push(pages);
  }
  win.forEach(function(p){
    if(p==='…'){ btns+='<span class="page-dots" aria-hidden="true">…</span>'; }
    else{
      btns+='<button class="page-btn'+(p===page?' active':'')+'" '+(p===page?'aria-current="page"':'')+' onclick="V.'+id+'.page='+p+';'+refreshFn+'()" aria-label="Página '+p+'">'+p+'</button>';
    }
  });
  return '<div class="pagination">'+
    '<span class="small">'+from+'–'+to+' de '+total+'</span>'+
    '<div class="pages">'+
    '<button class="page-btn" '+(page<=1?'disabled':'')+' onclick="V.'+id+'.page='+(page-1)+';'+refreshFn+'()" aria-label="Página anterior">'+ic('chevleft',16)+'</button>'+
    btns+
    '<button class="page-btn" '+(page>=pages?'disabled':'')+' onclick="V.'+id+'.page='+(page+1)+';'+refreshFn+'()" aria-label="Página siguiente">'+ic('chevright',16)+'</button>'+
    '</div>'+
    '<label class="small" for="pg-'+id+'">Mostrar <select class="input page-size" id="pg-'+id+'" onchange="V.'+id+'.per=+this.value;V.'+id+'.page=1;'+refreshFn+'()">'+
    [25,50,100].map(function(n){return '<option'+(per===n?' selected':'')+'>'+n+'</option>';}).join('')+'</select></label>'+
    '</div>';
}

/* ============================================================
   ADMIN — Contabilidad (plan, asientos, cierres, conciliación,
            impuestos, activos, estados financieros)
   ============================================================ */
function planLeaves(){
  var out = [];
  (function walk(items){
    items.forEach(function(n){
      if(n.bal!=null) out.push({code:n.code, nombre:n.nombre, bal:n.bal||0});
      else if(n.children) walk(n.children);
    });
  })(PLAN_CUENTAS);
  return out;
}
function leafByCode(code){ return planLeaves().filter(function(l){return l.code===code;})[0] || {nombre:code, bal:0}; }
function sumGroup(prefix){
  return planLeaves().reduce(function(a,l){ return l.code.indexOf(prefix)===0 ? a+l.bal : a; },0);
}

function editarSaldoCuenta(code){
  var l=leafByCode(code);
  var m=openModal('<div class="alert alert-info">'+ic('info',20)+'<div><h4>Ajuste de saldo</h4><p>Los movimientos reales provienen de asientos aprobados; este demo solo simula el ajuste manual de la cuenta.</p></div></div>'+
    '<div class="field"><label for="sc-codigo">Código</label><input class="input" value="'+esc(code)+'" disabled></div>'+
    '<div class="field"><label for="sc-nombre">Nombre</label><input class="input" value="'+esc(l.nombre)+'" disabled></div>'+
    '<div class="field"><label for="sc-saldo">Saldo (B/.) <span class="req">*</span></label><input class="input" id="sc-saldo" type="number" step="0.01" value="'+l.bal+'"></div>', {title:'Editar saldo — '+code});
  var foot=document.createElement('div');foot.className='modal-foot';
  foot.innerHTML='<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" id="sc-ok">Guardar</button>';
  m.querySelector('.modal-body').after(foot);
  m.querySelector('#sc-ok').onclick=function(){
    var v=+document.getElementById('sc-saldo').value;
    if(isNaN(v)){ toast('Saldo inválido.','warning','Dato incorrecto'); return; }
    PLAN_CUENTAS.forEach(function(grp){ (function walk(items){ items.forEach(function(n){ if(n.code===code){ n.bal=v; } else if(n.children){ walk(n.children); } }); })(grp.children||[]); });
    closeModal(); planRefresh();
    toast('Saldo de la cuenta '+code+' actualizado a '+fmtN(v)+'.','success','Saldo actualizado');
  };
}

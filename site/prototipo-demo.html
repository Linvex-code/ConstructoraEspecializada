function drawAsiento(num){
  var a=ASIENTOS.find(function(x){return x.num===num;});
  if(!a) return;
  var debe=a.lineas.reduce(function(s,l){return s+l.debe;},0);
  var haber=a.lineas.reduce(function(s,l){return s+l.haber;},0);
  var head='<div class="flex" style="gap:14px;align-items:flex-start">'+
    '<div class="avatar" style="width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none">'+ic('receipt',24)+'</div>'+
    '<div><div class="flex" style="gap:10px;margin-bottom:4px;flex-wrap:wrap"><h2 style="font-size:19px;font-weight:600;font-family:var(--font-mono)">'+esc(a.num)+'</h2>'+chipEstado(a.estado)+'</div>'+
    '<div class="strong" style="margin-bottom:2px">'+esc(a.desc)+'</div>'+
    '<div class="muted2 small">'+esc(a.fecha)+' · '+esc(a.periodo)+' · Ref. '+esc(a.ref||'—')+'</div></div></div>';
  var rows=a.lineas.map(function(l){ return '<tr><td class="mono small">'+esc(l.cuenta)+'</td><td>'+esc(l.nombre)+'</td><td class="num mono">'+(l.debe?fmtM(l.debe):'—')+'</td><td class="num mono">'+(l.haber?fmtM(l.haber):'—')+'</td></tr>'; }).join('');
  var body='<div class="card"><div class="stat-label st-sect">LÍNEAS DEL ASIENTO</div>'+
    '<div class="tbl-wrap"><table class="tbl dense tbl-hover"><thead><tr><th>Cuenta</th><th>Nombre</th><th class="num">Débito</th><th class="num">Crédito</th></tr></thead><tbody>'+rows+
    '<tr class="strong"><td colspan="2">Totales</td><td class="num mono">'+fmtM(debe)+'</td><td class="num mono">'+fmtM(haber)+'</td></tr></tbody></table></div></div>'+
    (debe===haber
      ? '<div class="alert alert-success">'+ic('circlecheck',20)+'<div><h4>Cuadrado</h4><p>Total débito = total crédito ('+fmtM(debe)+').</p></div></div>'
      : '<div class="alert alert-danger">'+ic('alert',20)+'<div><h4>Descuadrado</h4><p>El asiento no cuadra y el backend no permitiría su aprobación.</p></div></div>')+
    (a.estado==='Borrador'?'<div class="alert alert-info">'+ic('info',20)+'<div><h4>Integración</h4><p>Los pagos de Cobros y las liquidaciones generan asientos de caja como borrador (FL-COB-04 / FL-LIQ-03).</p></div></div>':'');
  var foot='<button class="btn btn-secondary" onclick="closeModal()">Cerrar</button>';
  if((a.estado==='Borrador'||a.estado==='Por aprobar')&&hasPerm('contabilidad.asientos.aprobar')) foot+='<button class="btn btn-primary" onclick="aprobarAsiento(\''+num+'\')">'+ic('check')+' Aprobar asiento</button>';
  openDrawer(head+body, {title:'Asiento '+a.num, size:'w720', foot:foot});

function aprobarAsiento(num){
  var a=ASIENTOS.find(function(x){return x.num===num;});
  if(!a) return;
  var debe=a.lineas.reduce(function(s,l){return s+l.debe;},0);
  var haber=a.lineas.reduce(function(s,l){return s+l.haber;},0);
  confirmDialog({
    title:'Aprobar asiento '+num, okLabel:'Aprobar',
    body:'Se validará que el asiento esté cuadrado y pasará a Aprobado, impactando los saldos del plan de cuentas.',
    onOk:function(){
      if(debe!==haber){ toast('El asiento está descuadrado; no se puede aprobar.','error','Validación fallida'); return; }
      a.estado='Aprobado'; asRefresh();
      toast('Asiento '+num+' aprobado. Los saldos del plan se actualizan.','success','Asiento aprobado');
    }
  });
}
function revertirAsiento(num){
  var a=ASIENTOS.find(function(x){return x.num===num;});
  if(!a) return;
  if(a.estado==='Aprobado'){ toast('Un asiento aprobado se revierte con un asiento inverso, no con edición.','warning','Regla contable'); return; }
  confirmDialog({title:'Revertir asiento '+num, danger:true, okLabel:'Revertir',
    body:'El asiento pasará a Revertido y dejará de estar pendiente de aprobación.',
    onOk:function(){ a.estado='Revertido'; asRefresh(); toast('Asiento '+num+' revertido.','success','Revertido'); }
  });
}
var AS_ROWS=2;
function crearAsiento(){
  var html='<div class="alert alert-info">'+ic('info',20)+'<div><h4>Partida doble</h4><p>El total débito debe ser igual al total crédito. Los asientos se crean en estado <b>Borrador</b> hasta su aprobación.</p></div></div>'+
    '<div class="form-grid" style="grid-template-columns:1fr 1fr">'+
    '<div class="field"><label for="ca-fecha">Fecha <span class="req">*</span></label><input class="input" id="ca-fecha" value="'+todayStr()+'"></div>'+
    '<div class="field"><label for="ca-per">Período <span class="req">*</span></label><select class="input" id="ca-per"><option>Septiembre 2026</option><option>Agosto 2026</option></select></div></div>'+
    '<div class="field"><label for="ca-desc">Descripción <span class="req">*</span></label><input class="input" id="ca-desc" placeholder="Ej.: Gasto de servicios por proyecto"></div>'+
    '<div class="stat-label" style="margin:10px 0 6px">LÍNEAS</div><div id="ca-lineas">'+asLineaRows()+'</div>'+
    '<button class="btn btn-secondary" style="margin-top:10px" onclick="asAddRow()">'+ic('plus')+' Agregar línea</button>'+
    '<div id="ca-tot" class="detail-tot"><span class="muted2 small">Totales</span><span class="mono small" id="ca-dh">Débito 0.00 · Crédito 0.00</span></div>';
  var m=openModal(html,{title:'Nuevo asiento', size:'lg'});
  [['ca-1-debe','ca-1-haber'],['ca-2-debe','ca-2-haber']].forEach(function(pair){ pair.forEach(function(id){ var el=document.getElementById(id); if(el) el.oninput=asTot; }); });
  var foot=document.createElement('div');foot.className='modal-foot';
  foot.innerHTML='<button class="btn btn-secondary" onclick="closeModal()">Cancelar</button>'+
    '<button class="btn btn-primary" id="ca-ok">'+ic('check')+' Guardar borrador</button>';
  m.querySelector('.modal-body').after(foot);
  m.querySelector('#ca-ok').onclick=function(){
    var desc=document.getElementById('ca-desc').value.trim();
    if(!desc){ toast('Indica la descripción del asiento.','warning','Datos incompletos'); return; }
    var lineas=[];
    for(var i=1;i<=AS_ROWS;i++){
      var cta=document.getElementById('ca-'+i+'-cta');
      var debe=+document.getElementById('ca-'+i+'-debe').value||0;
      var haber=+document.getElementById('ca-'+i+'-haber').value||0;
      if(!cta||!cta.value) continue;
      if(!debe&&!haber) continue;
      lineas.push({cuenta:cta.value, nombre:leafByCode(cta.value).nombre, debe:debe, haber:haber});
    }
    if(lineas.length<2){ toast('Registra al menos dos líneas para cuadrar la partida.','warning','Líneas insuficientes'); return; }
    var td=lineas.reduce(function(s,l){return s+l.debe;},0);
    var th=lineas.reduce(function(s,l){return s+l.haber;},0);
    if(td!==th){ toast('El asiento no cuadra: débito '+fmtM(td)+' ≠ crédito '+fmtM(th)+'.','error','Descua'); return; }
    var num='A-'+String(ASIENTOS.length+1).padStart(3,'0');
    ASIENTOS.push({num:num, fecha:document.getElementById('ca-fecha').value, periodo:document.getElementById('ca-per').value, desc:desc, ref:'Manual', estado:'Borrador', lineas:lineas});
    closeModal(); asRefresh();
    toast('Asiento '+num+' creado en Borrador ('+fmtM(td)+' = '+fmtM(th)+').','success','Borrador listo');
  };
}

function rhPlanillaDetalle(pl){
  var filas=[]; var tot={base:0, extras:0, css:0, presta:0, anticipo:0, neto:0};
  for(var i=0;i<RH_EMPLEADOS.length;i++){
    var e=RH_EMPLEADOS[i]; if(e.estado==='Terminado') continue;
    var base=Math.round(e.salario/2); var extras=0; var presta=0; var anticipo=0;
    for(var j=0;j<RH_HORAS_EXTRAS.length;j++){ var he=RH_HORAS_EXTRAS[j]; if(he.emp===e.id && (he.estado==='Aprobada'||he.estado==='En revisión')) extras+=he.horas*4.5; }
    for(var k=0;k<RH_PRESTAMOS.length;k++){ var p=RH_PRESTAMOS[k]; if(p.emp===e.id && p.estado==='Activo') presta+=p.cuota; }
    for(var l=0;l<RH_ANTICIPOS.length;l++){ var a=RH_ANTICIPOS[l]; if(a.emp===e.id && a.estado==='Aprobado') anticipo+=a.cuota; }
    var css=Math.round(base*0.0975);
    var neto=base+extras-css-presta-anticipo;
    filas.push({emp:e, base:base, extras:Math.round(extras), css:css, presta:presta, anticipo:anticipo, neto:neto});
    tot.base+=base; tot.extras+=Math.round(extras); tot.css+=css; tot.presta+=presta; tot.anticipo+=anticipo; tot.neto+=neto;
  }
  return {filas:filas, tot:tot};
}

function groupKeyForRoute(view, sub){
  var m = {clientes:'gest',inmuebles:'gest',contratos:'gest',cobros:'gest',liquidaciones:'gest',incidencias:'ops',lineablanca:'ops',notificaciones:'sys',administracion:'sys'};
  if(view==='mi-portal' || view==='mi-equipo') return 'miportal';
  if(view==='contabilidad') return 'cont';
  if(view==='rrhh') return 'rrhh';
  if(view==='reportes') return sub ? 'rrhh' : 'sys';
  return m[sub||view] || null;
}

function dispatchAdmin(v, sub){
  if(v==='resumen') return viewResumen();
  if(v==='mi-portal'){
    if(!ffOn('features.rrhh')) return moduloApagado('Recursos Humanos · portal del colaborador','features.rrhh');
    if(!rhActual()) return colaboradorGuard();
    if(sub==='recibos') return viewPortalEmpRecibos();
    if(sub==='asistencia') return viewPortalEmpAsistencia();
    if(sub==='tiempo-libre') return viewPortalEmpTiempoLibre();
    if(sub==='solicitudes') return viewPortalEmpSolicitudes();
    if(sub==='prestamos') return viewPortalEmpPrestamos();
    if(sub==='documentos') return viewPortalEmpDocumentos();
    if(sub==='datos') return viewPortalEmpDatos();
    if(sub==='notificaciones') return viewPortalNotificaciones();
    if(sub==='perfil') return viewPortalEmpPerfil();
    return viewPortalEmpResumen();
  }
  if(v==='mi-equipo'){
    if(!ffOn('features.rrhh')) return moduloApagado('Recursos Humanos · equipo','features.rrhh');
    var je = rhActual();
    if(!je || !rhEsJefe(je)) return colaboradorGuard('Mi equipo');
    if(sub==='asistencia') return viewPortalSupAsistencia();
    if(sub==='horas-extras') return viewPortalSupHorasExtras();
    if(sub==='ausencias') return viewPortalSupAusencias();
    if(sub==='evaluaciones') return viewPortalSupEvaluaciones();
    if(sub==='notificaciones') return viewPortalSupNotificaciones();
    if(sub==='perfil') return viewPortalSupPerfil();
    return viewPortalSupResumen();
  }
  if(v==='rrhh'){
    if(!ffOn('features.rrhh')) return moduloApagado('Recursos Humanos','features.rrhh');
    if(!can('rrhh')) return guardScreen(neededPerm('rrhh'));
    if(sub==='empleados') return viewRhhEmpleados();
    if(sub==='altas') return viewRhhNuevoEmpleado();
    if(sub==='empleado') return viewRhhEmpleado();
    if(sub==='contratos') return viewRhhContratos();
    if(sub==='organizacion') return viewRhhOrganizacion();
    if(sub==='proyectos') return viewRhhProyectos();
    if(sub==='asistencia') return viewRhhAsistencia();
    if(sub==='tiempo-libre') return viewRhhTiempoLibre();
    if(sub==='compensaciones') return viewRhhCompensaciones();
    if(sub==='nomina') return viewRhhNomina();
    if(sub==='planilla') return viewRhhPlanilla();
    if(sub==='liquidaciones') return viewRhhLiquidaciones();
    if(sub==='reclutamiento') return viewRhhReclutamiento();
    if(sub==='desarrollo') return viewRhhDesarrollo();
    if(sub==='seguridad') return viewRhhSeguridad();
    if(sub==='reportes') return viewRhhReportes();
    if(sub==='configuracion') return viewRhhConfiguracion();
    return viewRhh();
  }
  if(v==='empleados' && can('rrhh')) return viewRhhEmpleados();
  if(v==='clientes') return can('clientes') ? viewClientes() : guardScreen(neededPerm('clientes'));
  if(v==='inmuebles') return can('inmuebles') ? viewInmuebles() : guardScreen(neededPerm('inmuebles'));
  if(v==='contratos') return can('contratos') ? viewContratos() : guardScreen(neededPerm('contratos'));
  if(v==='cobros') return (can('cobros') || hasPerm('cobros.mora.consultar')) ? viewCobros() : guardScreen(neededPerm('cobros'));
  if(v==='liquidaciones') return can('liquidaciones') ? viewLiquidaciones() : guardScreen(neededPerm('liquidaciones'));
  if(v==='incidencias') return can('incidencias') ? viewIncidencias() : guardScreen(neededPerm('incidencias'));
  if(v==='lineablanca') return can('lineablanca') ? viewLineaBlanca() : guardScreen(neededPerm('lineablanca'));
  if(v==='contabilidad'){
    if(!ffOn('features.contabilidad')) return moduloApagado('Contabilidad','features.contabilidad');
    if(!can('contabilidad')) return guardScreen(neededPerm('contabilidad'));
    if(sub==='plan') return viewContPlan();
    if(sub==='asientos') return viewContAsientos();
    if(sub==='cierres') return viewContCierres();
    if(sub==='conciliacion') return viewContConciliacion();
    if(sub==='impuestos') return viewContImpuestos();
    if(sub==='activos') return viewContActivos();
    if(sub==='ef') return viewContEf();
    return viewContabilidad();
  }
  if(v==='notificaciones') return can('notificaciones') ? viewNotificaciones() : guardScreen(neededPerm('notificaciones'));
  if(v==='reportes') return can('reportes') ? viewReportes() : guardScreen(neededPerm('reportes'));
  if(v==='administracion') return can('administracion') ? viewAdministracion() : guardScreen(neededPerm('administracion'));
  if(v==='guia') return viewGuia();
  return viewResumen();
}
function render(){
  var r = parseRoute();
  var app = document.getElementById('app');
  if(!app) return;
  document.body.classList.remove('portal-body');
  // Normalización: las sesiones de colaboradores se gestionan dentro del panel admin
  if(session && (session.type==='empleado' || session.type==='supervisor')){
    session.type = 'admin';
    session.rol = session.rol || (session.user && session.user.rhId==='e6' ? 'JEFE' : 'COLABORADOR');
    try{ sessionStorage.setItem('grafito.session', JSON.stringify(session)); }catch(e){}
  }
  var html = '';
  if(r.area==='auth'){
    if(r.view==='login' && session){ goHome(); return; }
    document.title = 'Constructora Especializada · Acceso';
    html = r.view==='olvide-contrasena' ? viewOlvide()
         : r.view==='verificacion-otp' ? viewOtp(new URLSearchParams(location.hash.split('?')[1]||'').get('email'))
         : r.view==='restablecer-contrasena' ? viewRestablecer()
         : viewLogin();
  } else if(r.area==='app'){
    if(!session){ location.hash = '#/login'; return; }
    if(session.type!=='admin' && session.type!=='empleado' && session.type!=='supervisor'){ goHome(); return; }
    document.body.classList.remove('portal-body');
    var activeNav = (r.sub==='altas') ? 'empleados' : (r.sub || r.view);
    html = appShell(activeNav, dispatchAdmin(r.view, r.sub), groupKeyForRoute(r.view, r.sub));
    document.title = 'Constructora Especializada · Admin';
  } else if(r.area==='portal'){
    // Los colaboradores ya no tienen portal separado: son parte de la organización (RN módulo RH)
    if(r.portal==='empleado' || r.portal==='supervisor'){
      location.hash = (r.portal==='empleado') ? '#/app/mi-portal/'+(r.view||'resumen') : '#/app/mi-equipo/'+(r.view||'resumen');
      return;
    }
    // Portales de clientes: viven en archivos independientes (portal-inquilino.html / portal-propietario.html)
    if(r.portal!=='inquilino' && r.portal!=='propietario'){ goHome(); return; }
    if(!session || session.type!==r.portal){
      if(!session){ location.hash = '#/login'; return; }
      goHome(); return;
    }
    location.href = (r.portal==='inquilino' ? 'portal-inquilino.html' : 'portal-propietario.html') +
      '#/' + (r.view||'resumen') + (r.sub ? '/'+r.sub : '');
    return;
  } else {
    if(session){ goHome(); return; }
    document.title = 'Constructora Especializada · Acceso';
    html = viewLogin();
  }
  app.innerHTML = html;
  closeMenus();
  window.scrollTo(0,0);
}
function init(){
  try{ var saved = sessionStorage.getItem('grafito.session'); if(saved) session = JSON.parse(saved); }catch(e){}
  cargarFlags();
  render();
  window.addEventListener('hashchange', render, false);
  document.addEventListener('keydown', function(e){
    if(e.key==='/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) && !document.activeElement.isContentEditable){
      var g = document.getElementById('global-search');
      if(g){ e.preventDefault(); g.focus(); }
    }
    if(e.key==='Escape'){ closeMenus(); }
  });
  document.addEventListener('pointerdown', function(e){
    if(e.target && e.target.closest && !e.target.closest('.menu') && !e.target.closest('[onclick*="openUserMenu"]') && !e.target.closest('[onclick*="openNotifMenu"]')){ closeMenus(); }
  });
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', init); } else { init(); }
</script>
